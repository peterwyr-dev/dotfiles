  status_bar_bad: "#fab387"                # Peach
  status_bar_critical: "#f38ba8"           # Red

  session_label: "#74c7ec"                 # Sapphire
  session_border: "#6c7086"                # Overlay 0
  voice_status_bg: "#181825"               # Mantle
  selection_bg: "#45475a"                  # Surface 1

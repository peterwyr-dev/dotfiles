name: catppuccin-mocha
description: "Catppuccin Mocha — soothing pastel dark theme"

colors:
  # Catppuccin Mocha palette: https://catppuccin.com/palette
  background: "#1e1e2e"                   # Base

  banner_border: "#cba6f7"                # Mauve
  banner_title: "#b4befe"                 # Lavender
  banner_accent: "#cba6f7"                # Mauve
  banner_dim: "#7f849c"                   # Overlay 1
  banner_text: "#cdd6f4"                  # Text

  ui_accent: "#cba6f7"                    # Mauve

  ui_text: "#cdd6f4"                      # Text
  ui_label: "#89b4fa"                     # Blue
  ui_border: "#585b70"                    # Surface 2
  ui_ok: "#a6e3a1"                        # Green
  ui_error: "#f38ba8"                     # Red
  ui_warn: "#f9e2af"                      # Yellow
  ui_tool: "#fab387"                      # Peach
  ui_thinking: "#9399b2"                  # Overlay 2

  diff_added: "#20372f"                   # Green-tinted dark surface

# My personal config

# Prefix: Ctrl+s (press twice to send Ctrl+s to the active program)
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# General usability
set -g mouse on
set -g status-position top
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Keep the current directory when creating windows and panes
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Kitty translates Cmd+1..5 to Alt+1..5.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5

# Reload this configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# Catppuccin status line
set -g @catppuccin_flavor 'mocha'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Match the compact window and resource blocks shown in the reference
set -gF window-status-format "#[bg=#{@thm_surface_1},fg=#{@thm_fg}] ##I ##{pane_current_command} "
set -gF window-status-current-format "#[bg=#{@thm_mauve},fg=#{@thm_crust}] ##I ##{pane_current_command} "

set -g @cpu_low_bg_color "#[bg=#{@thm_green}]" # background color when cpu is low
set -g @cpu_medium_bg_color "#[bg=#{@thm_yellow}]" # background color when cpu is medium
set -g @cpu_high_bg_color "#[bg=#{@thm_red}]" # background color when cpu is high

set -g status-left ""
set -g status-right '#[fg=#{@thm_crust}]#{cpu_bg_color} CPU #{cpu_icon} #{cpu_percentage} '
set -ag status-right '#[bg=default] #[bg=#{@thm_flamingo}] MEM #{ram_percentage} '

run ~/.config/tmux/plugins/tpm/tpm
